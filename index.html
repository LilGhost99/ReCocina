<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ReCocina</title>
<link rel="apple-touch-icon" href="icono.png">
<link rel="icon" type="image/png" href="icono.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ReCocina">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F8F4DC">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;800&family=Archivo:wght@400;500;600;700;800&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#F8F4DC; --paper:#FFFDF0; --grid:#DCDFC4; --ink:#233611; --muted:#5B6A48;
  --green:#3F7F16; --green-d:#2A5310; --yellow:#F8C93A; --orange:#EE7A2C; --rasp:#C22F52; --teal:#2FA3B5;
  --tape:#F8D96A; --tape-ink:#2B2A1C; --line:#C9CFB0; --on-green:#FFF8D6; --side:#2A5310;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --font:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --marker:"Permanent Marker","Marker Felt","Comic Sans MS",cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --cream:#141C0E; --paper:#1F2B16; --grid:#222E19; --ink:#F4EFCF; --muted:#B8C29E; --line:#3A4A2A; --green:#6FB33A; --green-d:#4E8A24; --side:#0E1509;
}}
:root[data-theme="dark"]{--cream:#141C0E; --paper:#1F2B16; --grid:#222E19; --ink:#F4EFCF; --muted:#B8C29E; --line:#3A4A2A; --green:#6FB33A; --green-d:#4E8A24; --side:#0E1509}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;background:var(--cream);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--orange);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;height:100vh;height:100dvh}
.side{background:var(--side);color:var(--on-green);display:flex;flex-direction:column;padding:calc(18px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px));gap:6px;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 14px}
.brand b{font-family:var(--display);font-weight:800;font-size:32px;letter-spacing:.5px;line-height:1;color:var(--on-green)}
.brand small{display:block;font-size:9.5px;font-weight:700;color:var(--yellow);letter-spacing:.06em}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--orange);color:#fff;border:0;border-radius:14px;padding:13px;font-weight:800;font-size:16px;box-shadow:4px 4px 0 var(--yellow);margin:2px 4px 14px;text-decoration:none}
.cta:active{transform:translate(3px,3px);box-shadow:none}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;text-decoration:none;padding:11px 12px;border-radius:12px;font-weight:700;font-size:16px;color:#E3EBCB}
.nav a svg{flex:none}
.nav a .badge{margin-left:auto;background:var(--rasp);color:#fff;border-radius:999px;font-size:12px;padding:1px 8px;font-weight:800}
.nav a[aria-current="page"]{background:var(--on-green);color:var(--side)}
.nav a:hover:not([aria-current]){background:rgba(255,255,255,.08)}
.side .day{margin-top:auto;background:rgba(255,255,255,.08);border-radius:14px;padding:12px;font-size:13px;color:#DCE5C0}
.side .day b{display:block;font-family:var(--display);font-size:26px;color:var(--yellow);line-height:1}
.main{position:relative;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
  background-color:var(--cream);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
.screen{max-width:1040px;margin:0 auto;padding:calc(22px + env(safe-area-inset-top,0px)) 28px calc(40px + env(safe-area-inset-bottom,0px));animation:in .22s ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.back{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--green);font-weight:800;font-size:16px;padding:6px 0;margin-bottom:4px}
h1{font-family:var(--display);font-weight:800;font-size:52px;line-height:.95;margin:0;color:var(--green);text-transform:uppercase;text-shadow:3px 3px 0 var(--green-d)}
.sub{color:var(--muted);margin:6px 0 0;font-weight:600;max-width:60ch}
h3{font-family:var(--display);font-weight:800;font-size:26px;line-height:1;margin:0 0 12px;text-transform:uppercase;color:var(--green)}
.grid{display:grid;gap:18px}
.g2{grid-template-columns:1.3fr 1fr}.g4{grid-template-columns:repeat(4,1fr)}.g3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--paper);border:3px solid var(--green);border-radius:18px;padding:18px;box-shadow:6px 6px 0 var(--orange)}
.card.r{box-shadow:6px 6px 0 var(--rasp)}.card.y{box-shadow:6px 6px 0 var(--yellow)}.card.t{box-shadow:6px 6px 0 var(--teal)}
.kpi{border-radius:18px;padding:16px 18px;border:3px solid var(--ink);text-decoration:none;display:block}
.kpi .v{font-family:var(--display);font-size:50px;font-weight:800;line-height:1}
.kpi .l{font-size:14px;font-weight:700}
.k1{background:var(--yellow);color:#3A2A00;box-shadow:5px 5px 0 var(--orange)}
.k2{background:var(--green);color:var(--on-green);box-shadow:5px 5px 0 var(--rasp)}
.k3{background:var(--rasp);color:#FFF1E8;box-shadow:5px 5px 0 var(--yellow)}
.k4{background:var(--teal);color:#062A30;box-shadow:5px 5px 0 var(--green-d)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:2.5px solid var(--green);background:var(--paper);color:var(--green);border-radius:12px;padding:10px 16px;font-weight:800;font-size:15px;text-decoration:none}
.btn.o{background:var(--orange);border-color:var(--ink);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.btn.g{background:var(--green);border-color:var(--ink);color:var(--on-green);box-shadow:3px 3px 0 var(--ink)}
.btn.r{background:var(--rasp);border-color:var(--ink);color:#fff;box-shadow:3px 3px 0 var(--ink)}
.btn.big{width:100%;padding:16px;font-size:18px}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:6px;text-decoration:none;border:3px solid var(--ink);border-radius:16px;padding:14px;font-weight:800;font-size:17px;line-height:1.2}
.qa span{font-weight:600;font-size:13px;opacity:.9}
.row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:2px dashed var(--line);text-decoration:none;color:inherit}
.row:last-child{border-bottom:0}
a.row:hover{background:rgba(63,127,22,.06);border-radius:10px}
.tape{display:inline-block;background:var(--tape);color:var(--tape-ink);font-family:var(--marker);font-size:21px;line-height:1.2;padding:3px 14px 2px;transform:rotate(-1.4deg);clip-path:polygon(2% 0,98% 3%,100% 50%,98% 97%,1% 100%,0 50%)}
.row:nth-child(even) .tape{transform:rotate(1.1deg)}
.meta{display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap;font-size:14px;color:var(--muted);font-weight:700}
.due{font-weight:800;border-radius:999px;padding:2px 10px;font-size:13px;color:#fff;white-space:nowrap}
.due.r{background:var(--rasp)}.due.a{background:var(--orange)}.due.g{background:var(--green)}.due.x{background:#5a1020}
.chev{color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:2.5px solid var(--green);background:var(--paper);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:800;font-size:14.5px}
.chip[aria-pressed="true"]{background:var(--green);color:var(--on-green)}
.search{display:flex;align-items:center;gap:8px;border:2.5px solid var(--green);border-radius:12px;background:var(--paper);padding:0 12px;min-width:220px}
.search input{border:0;background:transparent;font:inherit;font-size:16px;padding:10px 0;width:100%;color:var(--ink);outline:none}
input.txt{font:inherit;font-size:17px;padding:12px 14px;border:2.5px solid var(--green);border-radius:12px;background:var(--cream);color:var(--ink);width:100%}
.steps{display:flex;gap:8px;margin-bottom:18px}
.steps i{flex:1;height:8px;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--orange)}
.lbl{font-size:14px;font-weight:800;color:var(--muted);margin:0 0 10px;text-transform:uppercase;letter-spacing:.04em}
.prodgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:10px}
.prod{border:2.5px solid var(--green);background:var(--paper);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;font-size:14.5px}
.prod .dot{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-size:20px;border:2.5px solid var(--ink)}
.prod[aria-pressed="true"]{background:var(--green);color:var(--on-green);box-shadow:3px 3px 0 var(--orange)}
.stepper{display:flex;align-items:center;gap:16px}
.stepper .val{font-family:var(--display);font-weight:800;font-size:64px;min-width:130px;text-align:center;line-height:1}
.round{width:54px;height:54px;border-radius:50%;padding:0;font-size:28px;display:grid;place-items:center;border:2.5px solid var(--green);background:var(--paper);color:var(--green);font-weight:800}
.err{color:var(--rasp);font-size:14px;font-weight:800;margin:8px 0 0;min-height:1.2em}
.sumbox{background:var(--yellow);color:#3A2A00;border:3px solid var(--ink);border-radius:16px;padding:16px;font-weight:700}
.sumbox b{font-family:var(--display);font-size:30px;display:block;line-height:1.1}
.recipe{background:var(--paper);border:3px solid var(--green);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:10px;text-decoration:none;color:inherit;box-shadow:5px 5px 0 var(--line)}
.recipe.best{box-shadow:6px 6px 0 var(--orange);border-color:var(--orange)}
.recipe h4{margin:0;font-family:var(--display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase;color:var(--green)}
.recipe.off{opacity:.6}
.ings{display:flex;flex-wrap:wrap;gap:6px}
.ing{font-size:13px;border-radius:999px;padding:3px 10px;background:var(--cream);font-weight:800;border:1.5px solid var(--line)}
.ing.r{background:var(--rasp);color:#fff;border-color:var(--rasp)}.ing.a{background:var(--orange);color:#fff;border-color:var(--orange)}
.ing.miss{background:transparent;border:1.5px dashed var(--line);color:var(--muted);text-decoration:line-through}
ol.how{margin:0;padding-left:0;list-style:none;counter-reset:s}
ol.how li{counter-increment:s;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:start;padding:10px 0;border-bottom:2px dashed var(--line);font-weight:600}
ol.how li:last-child{border:0}
ol.how li::before{content:counter(s);width:34px;height:34px;border-radius:50%;background:var(--yellow);border:2.5px solid var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:20px;color:#3A2A00}
.bins{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.bin{border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:8px;min-height:230px;border:3px solid var(--ink)}
.bin strong{font-family:var(--display);font-size:26px;text-transform:uppercase;line-height:1}
.bin .kg{font-family:var(--display);font-size:54px;font-weight:800;line-height:1}
.bin .d{font-size:13px;font-weight:700;opacity:.92}
.bin .b{display:flex;gap:6px;margin-top:auto}
.bin button{background:rgba(255,255,255,.25);border:2px solid currentColor;color:inherit;border-radius:10px;padding:8px 6px;font-weight:800;flex:1}
.bar{height:16px;background:var(--cream);border:2.5px solid var(--green);border-radius:999px;overflow:hidden;margin:12px 0 8px}
.bar>i{display:block;height:100%;background:var(--green);transition:width .4s}
.bed{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:12px 0;border-bottom:2px dashed var(--line)}
.bed:last-child{border:0}
.sprout{width:50px;height:50px;border-radius:14px;background:#5C3D24;display:grid;place-items:center;border:2.5px solid var(--ink)}
.log{margin:0;padding:0;list-style:none}
.log li{padding:8px 0;border-bottom:2px dashed var(--line);font-size:14.5px;font-weight:600;display:flex;gap:10px}
.log li b{font-family:var(--display);color:var(--orange);font-size:17px;flex:none;width:52px}
.log li:last-child{border:0}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0;border-bottom:2px dashed var(--line)}
.set:last-child{border:0}
.set p{margin:2px 0 0;color:var(--muted);font-size:14px;font-weight:600}
.empty{text-align:center;padding:30px 10px;color:var(--muted);font-weight:700}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--green-d);color:#FFF8D6;padding:13px 20px;border-radius:14px;font-weight:800;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;text-align:center;box-shadow:4px 4px 0 var(--yellow);z-index:30}
.toast.on{opacity:1;transform:translate(-50%,0)}
.done{text-align:center;padding:40px 10px}
.done .ok{width:104px;height:104px;border-radius:50%;background:var(--green);border:4px solid var(--ink);display:grid;place-items:center;margin:0 auto 20px;box-shadow:5px 5px 0 var(--yellow);color:#FFF8D6}
.onb{position:fixed;inset:0;z-index:40;background:var(--cream);display:flex;align-items:center;justify-content:center;padding:24px;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:44px 44px}
.onb[hidden]{display:none}
.onb .box{max-width:560px;width:100%;text-align:center}
.onb h2{font-family:var(--display);font-weight:800;font-size:58px;line-height:.95;margin:18px 0 10px;color:var(--green);text-transform:uppercase;text-shadow:3px 3px 0 var(--green-d)}
.onb p{font-size:18px;font-weight:600;color:var(--muted);margin:0 auto 24px;max-width:44ch}
.dots{display:flex;gap:8px;justify-content:center;margin:0 0 22px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--orange);width:28px;border-radius:999px}
.onb .ill{width:220px;height:170px;margin:0 auto;display:block}
.tabs{display:none}
.fab{display:none;position:fixed;right:18px;bottom:calc(86px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:50%;background:var(--orange);color:#fff;border:3px solid var(--ink);box-shadow:3px 3px 0 var(--ink);align-items:center;justify-content:center;z-index:20;text-decoration:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .side{display:none}
  .tabs{display:grid;grid-template-columns:repeat(6,1fr);background:var(--side);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));border-top:3px solid var(--ink)}
  .tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:#DCE5C0;font-size:11px;font-weight:800;padding:6px 0;border-radius:12px}
  .tabs a .badge{display:none}
  .tabs a[aria-current="page"]{color:var(--side);background:var(--on-green)}
  .screen{padding-left:16px;padding-right:16px}
  h1{font-size:42px}
  .g2,.g3{grid-template-columns:1fr}.g4{grid-template-columns:repeat(2,1fr)}
  .bins{grid-template-columns:repeat(2,1fr)}
  .quick{grid-template-columns:1fr}
  .fab{display:flex}
}
.screen.wide{max-width:1320px}
.pos{display:grid;grid-template-columns:1fr 380px;gap:22px;align-items:start}
.dishes{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.dish{position:relative;text-align:left;border:3px solid var(--ink);border-radius:16px;background:var(--paper);padding:0;overflow:hidden;display:flex;flex-direction:column;box-shadow:4px 4px 0 var(--ink);min-height:150px}
.dish:active:not(:disabled){transform:translate(2px,2px);box-shadow:none}
.dish .strip{height:12px;flex:none}
.dish .in{padding:30px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1;justify-content:flex-end}
.dish b{font-size:16.5px;line-height:1.2}
.dish .pr{font-family:var(--display);font-size:32px;line-height:1;color:var(--green)}
.dish s{color:var(--muted);font-size:16px}
.dish .left{font-size:12.5px;font-weight:800;color:var(--muted)}
.dish .rb{position:absolute;top:20px;right:8px;background:var(--rasp);color:#fff;font-size:11.5px;font-weight:800;border-radius:999px;padding:2px 8px}
.dish .qn{position:absolute;top:20px;left:8px;background:var(--orange);color:#fff;font-size:13px;font-weight:800;border-radius:999px;padding:1px 9px;border:2px solid var(--ink)}
.dish:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.order{position:sticky;top:12px}
.oline{display:grid;grid-template-columns:1fr auto;gap:8px;padding:10px 0;border-bottom:2px dashed var(--line)}
.qty{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.round.s{width:34px;height:34px;font-size:18px}
.tot{display:flex;justify-content:space-between;gap:10px;font-weight:700;padding:4px 0}
.tot.big{font-family:var(--display);font-size:40px;line-height:1.1;border-top:3px solid var(--ink);margin-top:8px;padding-top:10px}
.banner{background:var(--rasp);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:11px 14px;font-weight:800;margin-bottom:14px;box-shadow:4px 4px 0 var(--ink)}
.ticket{background:#fff;color:#222;max-width:420px;padding:22px 22px 34px;border:2px solid #ccc;font-family:"Courier New",ui-monospace,monospace;font-size:14.5px;line-height:1.5;filter:drop-shadow(6px 6px 0 #233611);clip-path:polygon(0 0,100% 0,100% calc(100% - 10px),95% 100%,90% calc(100% - 10px),85% 100%,80% calc(100% - 10px),75% 100%,70% calc(100% - 10px),65% 100%,60% calc(100% - 10px),55% 100%,50% calc(100% - 10px),45% 100%,40% calc(100% - 10px),35% 100%,30% calc(100% - 10px),25% 100%,20% calc(100% - 10px),15% 100%,10% calc(100% - 10px),5% 100%,0 calc(100% - 10px))}
.ticket .c{text-align:center}.ticket hr{border:0;border-top:1.5px dashed #999;margin:8px 0}.ticket .r{display:flex;justify-content:space-between;gap:10px}
.cfdi{position:relative;background:#fff;color:#1d2a14;border:3px solid var(--ink);border-radius:14px;padding:22px;overflow:hidden;font-size:14px;box-shadow:6px 6px 0 var(--orange)}
.cfdi .wm{position:absolute;left:50%;top:55%;transform:translate(-50%,-50%) rotate(-20deg);font-family:var(--display);font-size:78px;color:rgba(194,47,82,.12);white-space:nowrap;pointer-events:none}
.cfdi h3{color:#3F7F16}
.cfdi table{width:100%;border-collapse:collapse;margin:14px 0}
.cfdi th{background:#3F7F16;color:#fff;text-align:left;padding:7px 8px;font-size:13px}
.cfdi td{padding:7px 8px;border-bottom:1px solid #ddd}
.cfdi .tot{color:#1d2a14}
.kv{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-size:13.5px}.kv b{color:#5B6A48}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}.fld span{font-size:13px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tbl{width:100%;border-collapse:collapse}.tbl th{text-align:left;font-size:12.5px;color:var(--muted);text-transform:uppercase;padding:8px 6px;border-bottom:2.5px solid var(--ink)}.tbl td{padding:10px 6px;border-bottom:2px dashed var(--line);font-weight:600;vertical-align:middle}
.simtag{display:inline-block;background:var(--rasp);color:#fff;font-weight:800;font-size:12px;border-radius:999px;padding:3px 11px;white-space:nowrap}
.links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.links a{border:2.5px solid var(--green);border-radius:12px;padding:12px;font-weight:800;text-decoration:none;color:var(--green);background:var(--paper)}
.cartbar{display:none}
@media (max-width:1100px){.pos{grid-template-columns:1fr}.order{position:static}.cartbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;align-items:center;justify-content:space-between;gap:12px;background:var(--orange);color:#fff;border:3px solid var(--ink);border-radius:16px;padding:12px 16px;box-shadow:4px 4px 0 var(--ink);font-weight:800;text-decoration:none}.cartbar b{font-family:var(--display);font-size:28px}.screen.wide{padding-bottom:110px}}
@media (max-width:860px){.cartbar{bottom:calc(96px + env(safe-area-inset-bottom,0px))}}
body[data-r="caja"] .fab,body[data-r="cobrar"] .fab{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" aria-label="Menú principal">
    <div class="brand">
      <svg width="48" height="48" viewBox="0 0 100 100" aria-hidden="true" style="flex:none"><path d="M69.50,22.15 A34,34 0 1 1 41.20,17.16" fill="none" stroke="#EE7A2C" stroke-width="12"/><path d="M38.09,5.57 L53.76,13.79 L44.31,28.75 Z" fill="#EE7A2C"/><path d="M50 30c10 0 15 9 15 17s-7 16-15 16-15-7-15-16 5-17 15-17z" fill="#6FB33A" stroke="#FFF8D6" stroke-width="2.5"/><circle cx="50" cy="50" r="6.5" fill="#8A5A2B"/></svg>
      <div><b>RECOCINA</b><small>USA. COME. REGRESA A LA TIERRA.</small></div>
    </div>
    <a class="cta" href="#/registrar"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Registrar entrada</a>
    <nav class="nav" id="nav"></nav>
    <div class="day"><b id="sideDay">Día 1</b>Simulación de la demo<br><a href="#/mas" style="color:var(--yellow);font-weight:800">Avanzar día o reiniciar</a></div>
  </aside>
  <main class="main" id="main"><div id="view"></div></main>
  <nav class="tabs" id="tabs" aria-label="Menú principal"></nav>
</div>
<a class="fab" href="#/registrar" aria-label="Registrar entrada"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></a>
<div class="onb" id="onb" hidden><div class="box" id="onbBox"></div></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
const KEY="recocina-app-v3", ONB="recocina-onb-v2";
const WEIGHT={kg:1,L:1,pzas:0.15};
const COLORS=["#3F7F16","#EE7A2C","#C22F52","#2FA3B5","#C98A00","#8A5A2B"];
const CATALOG=[["Pollo","kg",2],["Carne","kg",3],["Pescado","kg",1],["Jitomate","kg",5],["Lechuga","pzas",4],["Cebolla","kg",10],
  ["Zanahoria","kg",10],["Calabacita","kg",5],["Aguacate","pzas",3],["Tortillas","kg",2],["Pan","pzas",2],
  ["Queso","kg",10],["Crema","L",7],["Leche","L",5],["Huevo","pzas",14],["Arroz","kg",90],["Frijol","kg",90]];
const DUE=[["Hoy",0],["Mañana",1],["3 días",3],["1 semana",7],["2 semanas",14],["1 mes",30],["3 meses",90]];
const RECIPES=[
  {name:"Tacos de pollo con verduras",ings:["Pollo","Tortillas","Jitomate","Cebolla","Lechuga"],time:25,steps:["Deshebra o pica el pollo y dóralo con cebolla.","Agrega el jitomate picado y cocina 5 minutos.","Calienta las tortillas.","Sirve con lechuga fileteada."]},
  {name:"Tortas de lo que hay",ings:["Pan","Pollo","Lechuga","Jitomate","Crema"],time:15,steps:["Abre el pan y úntale crema.","Rellena con pollo, jitomate y lechuga.","Dóralas en el comal 2 minutos por lado."]},
  {name:"Chilaquiles",ings:["Tortillas","Jitomate","Crema","Queso","Cebolla"],time:25,steps:["Corta las tortillas en triángulos y dóralas.","Licúa jitomate con cebolla y hierve la salsa.","Baña los totopos en la salsa.","Termina con crema, queso y cebolla."]},
  {name:"Sopa de verduras",ings:["Zanahoria","Calabacita","Jitomate","Cebolla"],time:35,steps:["Pica todas las verduras en cubos.","Sofríe cebolla y jitomate.","Agrega agua y las verduras duras primero.","Cocina 20 minutos y sazona."]},
  {name:"Arroz con verduras",ings:["Arroz","Zanahoria","Calabacita"],time:30,steps:["Lava y fríe el arroz hasta dorar.","Agrega agua, zanahoria y calabacita en cubos.","Cocina tapado a fuego bajo 20 minutos."]},
  {name:"Enfrijoladas",ings:["Tortillas","Frijol","Crema","Queso","Cebolla"],time:20,steps:["Licúa los frijoles cocidos y caliéntalos.","Pasa las tortillas por los frijoles y dóblalas.","Sirve con crema, queso y cebolla."]},
  {name:"Ensalada de la casa",ings:["Lechuga","Jitomate","Zanahoria","Pan"],time:10,steps:["Desinfecta y corta la lechuga.","Agrega jitomate y zanahoria rallada.","Haz crutones con el pan del día anterior."]},
  {name:"Pan de ajo con queso",ings:["Pan","Queso","Crema"],time:12,steps:["Rebana el pan.","Unta crema y cubre con queso.","Gratina 6 minutos."]},
  {name:"Huevos a la mexicana",ings:["Huevo","Jitomate","Cebolla","Tortillas"],time:15,steps:["Pica jitomate y cebolla y sofríe.","Agrega los huevos batidos y revuelve.","Sirve con tortillas calientes."]},
  {name:"Tostadas de carne",ings:["Carne","Tortillas","Lechuga","Crema","Aguacate"],time:25,steps:["Cocina y deshebra la carne.","Dora las tortillas hasta que truenen.","Arma con carne, lechuga, crema y aguacate."]}];
const seed=()=>({day:1,
  inv:[{id:1,name:"Pollo",qty:2,unit:"kg",days:1},{id:2,name:"Tortillas",qty:2,unit:"kg",days:1},
    {id:3,name:"Pan",qty:12,unit:"pzas",days:1},{id:4,name:"Jitomate",qty:3,unit:"kg",days:2},
    {id:5,name:"Crema",qty:1,unit:"L",days:2},{id:6,name:"Lechuga",qty:4,unit:"pzas",days:3},
    {id:7,name:"Calabacita",qty:1,unit:"kg",days:3},{id:8,name:"Zanahoria",qty:1.5,unit:"kg",days:5},
    {id:9,name:"Queso",qty:1,unit:"kg",days:6},{id:10,name:"Cebolla",qty:2,unit:"kg",days:7},
    {id:11,name:"Arroz",qty:5,unit:"kg",days:60},{id:12,name:"Frijol",qty:4,unit:"kg",days:90}],
  nextId:13,rescued:0,tossed:9.8,meals:0,bins:{org:1.5,rec:0.5,no:0.5,oil:0},compost:11,
  beds:[{name:"Lechuga",days:0,yield:6,unit:"pzas",shelf:5},{name:"Jitomate",days:3,yield:2,unit:"kg",shelf:5},
    {name:"Cilantro",days:6,yield:0.5,unit:"kg",shelf:4},{name:"Chile",days:10,yield:0.5,unit:"kg",shelf:10}],
  log:[{d:1,t:"La cocina empieza a usar ReCocina."}],
  sales:[],nextSale:1,nextFolio:1,rescuedCost:0,tossedCost:0,daily:{},
  usage:{Pollo:2.5,Tortillas:2,Jitomate:1.6,Cebolla:0.6,Lechuga:3,Pan:8,Queso:0.4,Crema:0.4,Arroz:0.8,Zanahoria:0.6,Calabacita:0.6,Frijol:0.5,Huevo:10}});
let S;
try{S=JSON.parse(localStorage.getItem(KEY))}catch(e){S=null}
if(!S||!Array.isArray(S.inv)||!Array.isArray(S.sales))S=seed();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=t=>String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=n=>(Math.round(n*10)/10).toLocaleString("es-MX");
const lvl=d=>d<0?"x":d<=1?"r":d<=3?"a":"g";
const dueTxt=d=>d<0?"Vencido":d===0?"Vence hoy":d===1?"Vence mañana":`Vence en ${d} días`;
const kgOf=i=>i.qty*(WEIGHT[i.unit]||1);
const stepOf=u=>u==="pzas"?1:0.5;
const colorOf=n=>COLORS[[...n].reduce((a,c)=>a+c.charCodeAt(0),0)%COLORS.length];
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),2800)}
function addLog(t){S.log.unshift({d:S.day,t});S.log=S.log.slice(0,30)}
const findInv=n=>S.inv.find(i=>i.name.toLowerCase()===n.toLowerCase()&&i.days>=0);
function scoreRecipe(r){let s=0,have=0,urgent=0;for(const n of r.ings){const i=findInv(n);if(i){have++;s+=i.days<=1?3:i.days<=3?2:0.4;if(i.days<=3)urgent++}}return{s,have,urgent,ok:have>=Math.ceil(r.ings.length*0.75)}}
const ranked=()=>RECIPES.map((r,ix)=>({r,ix,...scoreRecipe(r)})).sort((a,b)=>(b.ok-a.ok)||(b.s-a.s));

const I={
 home:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 box:'<path d="M3 7l9-4 9 4v10l-9 4-9-4z"/><path d="M3 7l9 4 9-4M12 11v10"/>',
 chef:'<path d="M7 14a4 4 0 0 1-1-7.9A5 5 0 0 1 12 3a5 5 0 0 1 6 3.1A4 4 0 0 1 17 14v6H7z"/><path d="M7 17h10"/>',
 trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 14h10l1-14"/><path d="M10 11v6M14 11v6"/>',
 leaf:'<path d="M5 21c0-9 5-15 15-16-1 10-7 15-15 16z"/><path d="M5 21l8-8"/>',
 more:'<circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',chev:'<path d="M9 5l7 7-7 7"/>',search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
 clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',check:'<path d="M5 12l5 5 9-10"/>',
 cart:'<path d="M3 4h2l2.4 11h10.8L21 7H6.2"/><circle cx="9" cy="19.5" r="1.5"/><circle cx="17" cy="19.5" r="1.5"/>',
 list:'<path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6h.01M4 12h.01M4 18h.01"/>',
 receipt:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>'};
const ico=(n,s=22,w=2.4)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${I[n]}</svg>`;
const NAV=[["inicio","Inicio","home"],["caja","Caja","cart"],["inventario","Inventario","box"],["menu","Menú personal","chef"],["compras","Compras","list"],["ventas","Ventas","receipt"],["residuos","Residuos","trash"],["huerto","Huerto","leaf"],["mas","Más","more"]];
const TABS=["inicio","caja","inventario","menu","ventas","mas"];

const blankF=()=>({step:1,name:null,custom:false,cname:"",qty:1,unit:"kg",days:3});
let F=blankF();
let invFilter="todos",invQuery="";

const head=(title,sub,backTo)=>`<div class="top"><div>${backTo?`<button class="back" data-back="${backTo}">${ico("back",20,3)}Regresar</button>`:""}<h1>${title}</h1>${sub?`<p class="sub">${sub}</p>`:""}</div></div>`;
const itemRow=i=>`<a class="row" href="#/producto/${i.id}"><div><span class="tape">${esc(i.name)}</span><div class="meta"><span class="due ${lvl(i.days)}">${dueTxt(i.days)}</span>${fmt(i.qty)} ${i.unit}</div></div><span class="chev">${ico("chev")}</span></a>`;

function vInicio(){
  const urgent=[...S.inv].filter(i=>i.days<=1).sort((a,b)=>a.days-b.days);
  const best=ranked()[0];
  const pct=Math.min(100,Math.max(0,(12-S.tossed)/(12-8.4)*100));
  return head("Hola, equipo",`Día ${S.day} en la cocina. Esto es lo que necesita atención hoy.`)+
  `<div class="grid g4">
    <a class="kpi k1" href="#/ahorro"><div class="v">${money0(S.rescuedCost)}</div><div class="l">en comida rescatada</div></a>
    <a class="kpi k2" href="#/ventas"><div class="v">${money0(S.sales.filter(x=>x.day===S.day).reduce((a,x)=>a+x.total,0))}</div><div class="l">vendido hoy</div></a>
    <a class="kpi k3" href="#/inventario?f=urgente"><div class="v">${urgent.length}</div><div class="l">vencen hoy o mañana</div></a>
    <a class="kpi k4" href="#/huerto"><div class="v">${fmt(S.compost)} kg</div><div class="l">en la composta</div></a>
  </div>
  <div class="grid g2" style="margin-top:22px">
    <div class="card r"><h3>Atiende hoy</h3>${urgent.length?urgent.map(itemRow).join(""):`<div class="empty">Nada vence hoy ni mañana.</div>`}</div>
    <div class="grid" style="align-content:start">
      ${best&&best.ok&&best.urgent?`<a class="recipe best" href="#/receta/${best.ix}"><span class="due a" style="align-self:flex-start">Sugerencia del día</span><h4>${esc(best.r.name)}</h4><span style="font-weight:700;color:var(--muted);font-size:14px">Usa ${best.urgent} ingrediente${best.urgent>1?"s":""} por vencer · ${best.r.time} min</span></a>`:""}
      <div class="card y"><h3>Meta SMART</h3><p class="sub" style="margin:0">Bajar de 12 kg a 8.4 kg tirados por semana (‑30%).</p>
        <div class="bar"><i style="width:${pct}%"></i></div><b>${S.tossed<=8.4?`¡Meta cumplida! ${fmt(S.tossed)} kg esta semana.`:`${fmt(S.tossed)} kg tirados. Faltan ${fmt(S.tossed-8.4)} kg.`}</b></div>
    </div>
  </div>
  <h3 style="margin:28px 0 12px">Acciones rápidas</h3>
  <div class="quick">
    <a class="qa" href="#/caja" style="background:var(--orange);color:#fff;box-shadow:4px 4px 0 var(--ink)">Abrir la caja<span>Cobrar y vender el rescate del día</span></a>
    <a class="qa" href="#/registrar" style="background:var(--yellow);color:#3A2A00;box-shadow:4px 4px 0 var(--ink)">Registrar entrada<span>Lo que llegó del proveedor</span></a>
    <a class="qa" href="#/compras" style="background:var(--teal);color:#062A30;box-shadow:4px 4px 0 var(--ink)">Lista de compras<span>Qué pedir para mañana</span></a>
  </div>`;
}
function vInventario(){
  let list=[...S.inv].sort((a,b)=>a.days-b.days);
  const counts={todos:list.length,urgente:list.filter(i=>i.days>=0&&i.days<=3).length,vencido:list.filter(i=>i.days<0).length};
  if(invFilter==="urgente")list=list.filter(i=>i.days>=0&&i.days<=3);
  if(invFilter==="vencido")list=list.filter(i=>i.days<0);
  if(invQuery)list=list.filter(i=>i.name.toLowerCase().includes(invQuery.toLowerCase()));
  return head("Inventario","Ordenado por caducidad: primero en entrar, primero en salir. Toca un producto para ver su detalle.")+
  `<div style="display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:16px">
    <div class="chips">${[["todos","Todos"],["urgente","Por vencer"],["vencido","Vencidos"]].map(([k,t])=>`<button class="chip" data-filter="${k}" aria-pressed="${invFilter===k}">${t} (${counts[k]})</button>`).join("")}</div>
    <label class="search">${ico("search",18)}<input id="q" type="search" placeholder="Buscar producto" value="${esc(invQuery)}" autocomplete="off" aria-label="Buscar producto"></label>
  </div>
  <div class="grid g2"><div class="card" id="invList">${list.length?list.map(itemRow).join(""):`<div class="empty">No hay productos aquí.</div>`}</div>
  <div class="grid" style="align-content:start">
    <div class="card y"><h3>Colores</h3>
      <div class="meta"><span class="due r">Rosa</span> vence hoy o mañana</div><div class="meta"><span class="due a">Naranja</span> vence en 3 días o menos</div>
      <div class="meta"><span class="due g">Verde</span> todavía tiene tiempo</div><div class="meta"><span class="due x">Vino</span> ya venció, va a residuos</div></div>
    <a class="btn o big" href="#/registrar">${ico("box",20)}Registrar entrada</a>
  </div></div>`;
}
function vProducto(id){
  const i=S.inv.find(x=>x.id===+id);
  if(!i)return head("Producto","Este producto ya no está en el inventario.","#/inventario")+`<a class="btn g" href="#/inventario">Ir al inventario</a>`;
  const uses=RECIPES.map((r,ix)=>({r,ix})).filter(x=>x.r.ings.includes(i.name));
  return head(esc(i.name),"Detalle del producto","#/inventario")+
  `<div class="grid g2"><div class="card">
     <span class="tape" style="font-size:30px">${esc(i.name)}</span>
     <div class="meta" style="margin:12px 0 20px"><span class="due ${lvl(i.days)}" style="font-size:15px">${dueTxt(i.days)}</span></div>
     <p class="lbl">Cantidad en almacén</p>
     <div class="stepper"><button class="round" data-adj="-1" aria-label="Usar">−</button><span class="val">${fmt(i.qty)}</span><button class="round" data-adj="1" aria-label="Agregar">+</button><b style="color:var(--muted)">${i.unit}</b></div>
     <p class="sub" style="margin-top:10px">Usa − cuando saques producto y + si llegó más.</p>
     ${i.days<0?`<button class="btn r big" data-trash style="margin-top:18px">${ico("trash",20)}Mover a residuos</button>`:`<button class="btn big" data-del style="margin-top:18px">Se terminó, quitar del inventario</button>`}
   </div>
   <div class="card t"><h3>Úsalo en</h3>${uses.length?uses.map(x=>`<a class="row" href="#/receta/${x.ix}"><div><b>${esc(x.r.name)}</b><div class="meta">${ico("clock",16)} ${x.r.time} min</div></div><span class="chev">${ico("chev")}</span></a>`).join(""):`<div class="empty">Aún no hay recetas con este producto.</div>`}</div></div>`;
}
function vRegistrar(){
  const nm=F.custom?(F.cname||""):F.name;
  const stepBar=`<div class="steps">${[1,2,3].map(n=>`<i class="${F.step>=n?"on":""}"></i>`).join("")}</div>`;
  let body="";
  if(F.step===1){
    body=`<p class="lbl">Paso 1 de 3 · ¿Qué llegó?</p><div class="prodgrid">${CATALOG.map(([n])=>`<button class="prod" data-pick="${n}" aria-pressed="${!F.custom&&F.name===n}"><span class="dot" style="background:${colorOf(n)}">${n[0]}</span>${n}</button>`).join("")}
      <button class="prod" data-pick="__otro" aria-pressed="${F.custom}" style="border-style:dashed"><span class="dot" style="background:var(--paper);color:var(--green)">+</span>Otro</button></div>
      ${F.custom?`<div style="margin-top:16px"><p class="lbl">Nombre del producto</p><input class="txt" id="cname" value="${esc(F.cname||"")}" placeholder="Ej. Champiñones" autocomplete="off"></div>`:""}
      <p class="err" id="err"></p><button class="btn o big" data-next="2" ${F.name||(F.custom&&F.cname.trim())?"":"disabled"}>Siguiente</button>`;
  }else if(F.step===2){
    body=`<p class="lbl">Paso 2 de 3 · ¿Cuánto llegó de ${esc(nm)}?</p>
      <div class="card" style="display:flex;flex-direction:column;align-items:center;gap:16px">
        <div class="stepper"><button class="round" data-q="-1" aria-label="Menos">−</button><span class="val">${fmt(F.qty)}</span><button class="round" data-q="1" aria-label="Más">+</button></div>
        <div class="chips">${["kg","pzas","L"].map(u=>`<button class="chip" data-unit="${u}" aria-pressed="${F.unit===u}">${u}</button>`).join("")}</div></div>
      <div style="display:flex;gap:12px;margin-top:22px"><button class="btn" data-next="1" style="flex:1">Atrás</button><button class="btn o" data-next="3" style="flex:2">Siguiente</button></div>`;
  }else{
    body=`<p class="lbl">Paso 3 de 3 · ¿Cuándo vence?</p><div class="chips" style="margin-bottom:20px">${DUE.map(([t,d])=>`<button class="chip" data-due="${d}" aria-pressed="${F.days===d}">${t}</button>`).join("")}</div>
      <div class="sumbox"><span>Vas a registrar</span><b>${fmt(F.qty)} ${F.unit} de ${esc(nm)}</b><span>${dueTxt(F.days)}</span></div>
      <div style="display:flex;gap:12px;margin-top:22px"><button class="btn" data-next="2" style="flex:1">Atrás</button><button class="btn g" data-save style="flex:2">${ico("check",20,3)}Guardar en inventario</button></div>`;
  }
  return head("Registrar entrada","Tres pasos: producto, cantidad y caducidad.","#/inventario")+`<div style="max-width:760px">${stepBar}${body}</div>`;
}
function vMenu(){
  const R=ranked();
  return head("Menú del personal","Recetas ordenadas por cuánta comida por vencer rescatan. Toca una para ver cómo prepararla.")+
  `<div class="grid g3">${R.map((x,k)=>{const best=k===0&&x.ok&&x.urgent;return `<a class="recipe ${best?"best":""} ${x.ok?"":"off"}" href="#/receta/${x.ix}">
    ${best?`<span class="due a" style="align-self:flex-start">Recomendada hoy</span>`:""}
    <h4>${esc(x.r.name)}</h4>
    <div class="ings">${x.r.ings.map(n=>{const i=findInv(n);return i?`<span class="ing ${i.days<=1?"r":i.days<=3?"a":""}">${esc(n)}</span>`:`<span class="ing miss">${esc(n)}</span>`}).join("")}</div>

function consume(n,q){
  const items=S.inv.filter(i=>i.name===n&&i.days>=0).sort((a,b)=>a.days-b.days);
  let left=q,cost=0,urgent=0,kg=0;
  for(const i of items){if(left<=1e-9)break;const take=Math.min(i.qty,left);i.qty=Math.round((i.qty-take)*1000)/1000;left-=take;const c=take*priceOf(n);cost+=c;if(i.days<=1){urgent+=c;kg+=take*(WEIGHT[i.unit]||1)}}
  S.inv=S.inv.filter(i=>i.qty>0.0005);
  S.usage[n]=(S.usage[n]||0)+q;
  return {cost,urgent,kg};
}

function comprasList(){
  const names=new Set([...CATALOG.map(c=>c[0]),...Object.keys(S.usage)]);const out=[];
  names.forEach(n=>{const per=(S.usage[n]||0)/Math.max(1,S.day);if(!per)return;
    const have=S.inv.filter(i=>i.name===n&&i.days>=2).reduce((a,i)=>a+i.qty,0);
    const unit=(CATALOG.find(c=>c[0]===n)||[n,(S.inv.find(i=>i.name===n)||{}).unit||"kg"])[1];
    const st=stepOf(unit);let buy=Math.max(0,per*2-have);buy=Math.ceil(buy/st-1e-9)*st;
    if(buy>0)out.push({n,unit,per,have,buy,cost:buy*priceOf(n)})});
  return out.sort((a,b)=>b.cost-a.cost);
}

  if(d.add){const dd=DISHES.find(x=>x.id===d.add);if(!dd)return;if((CART[dd.id]||0)>=avail(dd)){toast("Ya no alcanzan los ingredientes para otro.");return}CART[dd.id]=(CART[dd.id]||0)+1;route();return}
  if(d.cq){const dd=DISHES.find(x=>x.id===d.cq);const nv=(CART[d.cq]||0)+(+d.v);if(+d.v>0&&nv>avail(dd)){toast("Ya no alcanzan los ingredientes para otro.");return}CART[d.cq]=Math.max(0,nv);route();return}
  if(d.clearcart!==undefined){CART={};route();return}
  if(d.pm){PAY.method=d.pm;route();return}
  if(d.recv){PAY.recv=String(+d.recv);route();return}
  if(d.pay!==undefined){const lines=cartLines();if(!lines.length)return;const tot=cartTotal();if(PAY.method==="efectivo"&&(+PAY.recv||0)<tot-0.001){$("payerr").textContent="El monto recibido no alcanza.";return}
    let resc=0,kg=0;for(const l of lines)for(const [n,q] of Object.entries(l.d.ings)){const c=consume(n,q*l.q);resc+=c.urgent;kg+=c.kg}
    const sale={id:S.nextSale++,day:S.day,time:nowTime(),lines:lines.map(l=>({id:l.d.id,name:l.d.name,price:l.price,q:l.q,resc:!!(l.resc&&Object.keys(l.d.ings).length)})),full:cartFull(),total:tot,method:PAY.method,recv:PAY.method==="efectivo"?+PAY.recv:tot,rescued:resc,factura:null};
    S.sales.push(sale);S.rescuedCost+=resc;S.rescued+=kg;bump("ventas",tot);bump("resc",resc);bump("n",1);
    addLog(`Venta #${String(sale.id).padStart(5,"0")} por ${money(tot)}${resc>0?`, rescató ${money(resc)} en ingredientes`:""}.`);
    CART={};PAY={method:"efectivo",recv:""};save();go("#/ticket/"+sale.id);return}
  if(d.factgen){const sl=S.sales.find(x=>x.id===+d.factgen);if(!sl)return;
    const rfc=$("f_rfc").value.trim().toUpperCase(),nm=$("f_name").value.trim(),cp=$("f_cp").value.trim(),mail=$("f_mail").value.trim();
    let er="";if(!/^[A-ZÑ&]{3,4}\d{6}[A-Z0-9]{3}$/.test(rfc))er="El RFC no tiene un formato válido (12 o 13 caracteres).";else if(!nm)er="Escribe el nombre o razón social.";else if(!/^\d{5}$/.test(cp))er="El código postal debe tener 5 números.";
    if(er){$("ferr").textContent=er;return}
    sl.factura={rfc,name:nm.toUpperCase(),cp,reg:$("f_reg").value,uso:$("f_uso").value,mail,uuid:uuid(),folio:S.nextFolio++,day:S.day,time:nowTime()};
    addLog(`Factura RC-${sl.factura.folio} (simulada) para ${sl.factura.name}.`);save();route();toast("Factura simulada generada.");return}
  if(d.sendmail){const sl=S.sales.find(x=>x.id===+d.sendmail);toast(sl&&sl.factura&&sl.factura.mail?`Enviada a ${sl.factura.mail} (simulado).`:"Envío simulado: el cliente recibiría su PDF y XML.");return}
  if(d.buy||d.buyall!==undefined){const L=comprasList().filter(x=>d.buyall!==undefined||x.n===d.buy);
    L.forEach(x=>{const c=CATALOG.find(k=>k[0]===x.n);S.inv.push({id:S.nextId++,name:x.n,qty:x.buy,unit:x.unit,days:c?c[2]:7})});
    if(L.length){addLog(`Llegó el pedido: ${L.map(x=>x.n.toLowerCase()).join(", ")}.`);save();route();toast(L.length>1?"Pedido registrado en el inventario.":`${L[0].n} registrado en el inventario.`)}return}
  if(d.onb!==undefined){showOnb(0);return}
});

const LOGO_SVG=`<svg class="ill" viewBox="0 0 100 100"><path d="M69.50,22.15 A34,34 0 1 1 41.20,17.16" fill="none" stroke="#EE7A2C" stroke-width="12"/><path d="M38.09,5.57 L53.76,13.79 L44.31,28.75 Z" fill="#EE7A2C"/><path d="M50 30c10 0 15 9 15 17s-7 16-15 16-15-7-15-16 5-17 15-17z" fill="#3F7F16" stroke="#2A5310" stroke-width="2.5"/><circle cx="50" cy="50" r="6.5" fill="#8A5A2B"/></svg>`;
const tapeSvg=(y,r,t,c,w)=>`<g transform="rotate(${r} 110 ${y+17})"><rect x="30" y="${y}" width="160" height="34" fill="#F8D96A"/><text x="46" y="${y+24}" font-family="Permanent Marker,cursive" font-size="20" fill="#2B2A1C">${t}</text><rect x="${182-w}" y="${y+8}" width="${w}" height="18" rx="9" fill="${c}"/></g>`;
const ONB_SLIDES=[
 {t:"Bienvenido a ReCocina",p:"La app que ayuda a tu restaurante a dejar de tirar comida y dinero.",ill:LOGO_SVG},
 {t:"Sabe qué vence",p:"Registra lo que llega y ReCocina te avisa con colores qué hay que usar primero.",ill:`<svg class="ill" viewBox="0 0 220 170">${tapeSvg(16,-3,"Pollo","#C22F52",60)}${tapeSvg(70,2,"Jitomate","#EE7A2C",40)}${tapeSvg(124,-1,"Arroz","#3F7F16",30)}</svg>`},
 {t:"Cocina y cierra el ciclo",p:"Usa lo que vence en el menú del personal. Lo que sobra va a la composta y regresa como cosecha.",ill:`<svg class="ill" viewBox="0 0 220 170"><circle cx="110" cy="85" r="62" fill="none" stroke="#EE7A2C" stroke-width="12" stroke-dasharray="340 50" transform="rotate(-80 110 85)"/><circle cx="110" cy="85" r="38" fill="#fff" stroke="#233611" stroke-width="4"/><ellipse cx="98" cy="82" rx="13" ry="8" fill="#F1D18A" stroke="#233611" stroke-width="2"/><ellipse cx="122" cy="82" rx="13" ry="8" fill="#F1D18A" stroke="#233611" stroke-width="2"/><circle cx="110" cy="98" r="6" fill="#8CC152" stroke="#233611" stroke-width="2"/></svg>`}];
function showOnb(n){
  const s=ONB_SLIDES[n],last=n===ONB_SLIDES.length-1;
  $("onb").hidden=false;
  $("onbBox").innerHTML=`${s.ill}<h2>${s.t}</h2><p>${s.p}</p><div class="dots">${ONB_SLIDES.map((_,k)=>`<i class="${k===n?"on":""}"></i>`).join("")}</div>
   <div style="display:flex;gap:12px;justify-content:center"><button class="btn" id="onbSkip">Saltar</button><button class="btn o" id="onbNext" style="min-width:180px">${last?"Empezar":"Siguiente"}</button></div>`;
  $("onbSkip").onclick=closeOnb;$("onbNext").onclick=()=>last?closeOnb():showOnb(n+1);
}
function closeOnb(){$("onb").hidden=true;try{localStorage.setItem(ONB,"1")}catch(e){}}
let seen=null;try{seen=localStorage.getItem(ONB)}catch(e){}
route();
if(!seen&&!location.search.includes("noonb"))showOnb(0);
</script>
